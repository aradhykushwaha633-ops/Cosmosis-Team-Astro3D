<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cosmosis: the scale of the universe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #02030a;
            --ink: #ece8df;
            --mute: #97a0b8;
            --acc: #a9c7ff;
            --glass: rgba(12, 16, 30, .52);
            --line: rgba(236, 232, 223, .14);
            color-scheme: dark
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font: 300 14px/1.55 'Hanken Grotesk', system-ui, sans-serif;
            touch-action: none;
            -webkit-font-smoothing: antialiased
        }

        #c {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        .hdr {
            position: fixed;
            inset: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 0;
            pointer-events: none
        }

        .logo {
            font: 400 27px/1 'Instrument Serif', Georgia, serif
        }

        .btn {
            pointer-events: auto;
            font: 400 13px 'Hanken Grotesk', system-ui, sans-serif;
            color: var(--ink);
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 9px 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            cursor: pointer
        }

        .btn:hover {
            border-color: var(--acc)
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 3px
        }

        .read {
            position: fixed;
            inset: calc(72px + env(safe-area-inset-top, 0px)) 0 auto;
            text-align: center;
            pointer-events: none
        }

        .read b {
            display: block;
            font: 400 clamp(40px, 11vw, 76px)/1.05 'Instrument Serif', Georgia, serif;
            text-shadow: 0 2px 30px rgba(0, 0, 0, .7)
        }

        .read span {
            font-size: 12px;
            color: var(--mute)
        }

        .dock {
            position: fixed;
            left: 50%;
            bottom: 0;
            width: min(100%, 600px);
            transform: translateX(-50%);
            padding: 0 14px calc(12px + env(safe-area-inset-bottom, 0px));
            pointer-events: none
        }

        .card,
        .rail {
            pointer-events: auto
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px 20px 18px
        }

        #cb {
            animation: in .6s ease
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(6px)
            }
        }

        .card h2 {
            font: 400 30px/1.1 'Instrument Serif', Georgia, serif
        }

        .sz {
            color: var(--acc);
            font-size: 12.5px;
            margin: 3px 0 6px
        }

        .card p {
            font-size: 13.5px;
            color: #cfd3df;
            max-width: 60ch
        }

        .hint {
            text-align: center;
            font-size: 12px;
            color: var(--mute);
            margin-bottom: 10px;
            transition: opacity .6s
        }

        .rail {
            position: relative;
            height: 34px;
            margin: 6px 8px 0;
            cursor: pointer;
            touch-action: none
        }

        .trk,
        .fill {
            position: absolute;
            left: 0;
            top: 16px;
            height: 1px;
            background: var(--line);
            right: 0
        }

        .fill {
            background: var(--acc);
            right: auto;
            width: 0
        }

        .tk {
            position: absolute;
            top: 12px;
            width: 9px;
            height: 9px;
            margin-left: -4.5px;
            border-radius: 50%;
            background: #070a14;
            border: 1px solid var(--mute);
            transition: .4s
        }

        .tk.on {
            border-color: var(--acc);
            background: var(--acc);
            box-shadow: 0 0 12px var(--acc)
        }

        .thumb {
            position: absolute;
            z-index: 2;
            top: 9px;
            width: 15px;
            height: 15px;
            margin-left: -7.5px;
            border-radius: 50%;
            border: 1px solid #fff;
            background: rgba(255, 255, 255, .18)
        }

        .lb {
            position: fixed;
            left: 0;
            top: -7px;
            pointer-events: none;
            font-size: 12px;
            color: var(--ink);
            padding-left: 15px;
            white-space: nowrap;
            opacity: 0;
            text-shadow: 0 0 8px #000, 0 0 3px #000
        }

        .lb:before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 7px;
            height: 7px;
            margin-top: -3.5px;
            border: 1px solid var(--ink);
            border-radius: 50%
        }

        @media(prefers-reduced-motion:reduce) {
            #cb {
                animation: none
            }
        }
    </style>
</head>

<body>

        <div class="logo">Cosmosis</div><button class="btn" id="play">Begin journey</button>

                <div class="sz" id="ci"></div>
                <h2 id="ct"></h2>

        </div>
        <div class="rail" id="rail"><i class="trk"></i><i class="fill" id="fill"></i><i class="thumb" id="th"></i></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

            });
            yw = 0; if (best !== cur) show(best);

        }
        requestAnimationFrame(loop);
