        }

            background: var(--acc);
            box-shadow: 0 0 12px var(--acc)

            width: 15px;
            height: 15px;

            top: -7px;

        }

        }

        }

            if (tour) { T = Math.min(SMAX, T + dt * .8); if (T >= SMAX) stopTour() }
            s += (T - s) * Math.min(1, dt * 4.5);
            camera.position.x += (mx * .7 * mo - camera.position.x) * .04; camera.position.y += (1.1 - my * .4 * mo - camera.position.y) * .04; camera.lookAt(0, 0, 0); bg.rotation.y = s * .04; const bo = 1 - .8 * ss(24, 26, s); bg.traverse(o => o.material && (o.material.opacity = bo * (o.material.userData.b ?? 1))); ren.setClearColor(CC.setHSL((.62 + .22 * Math.sin(s * .33) + 1) % 1, .55, .045));
            const K = 1.3 * Math.min(1, camera.aspect * 1.15); let best = 0, bd = 99;
            S.forEach((st, i) => {
                const d = s - st.L, o = (i ? ss(-1.5, -.3, d) : 1) * (i < S.length - 1 ? 1 - ss(1.6, 3.2, d) : 1), g = st.g; st.o = o; if (Math.abs(d) < bd) { bd = Math.abs(d); best = i } g.visible = o > .004; if (!g.visible) return;
                g.scale.setScalar(K * Math.pow(10, -d)); g.rotation.y += dt * .012 * mo + yw; st.tk && st.tk(dt * mo); st.mats.forEach(m => { if (m.uniforms) { m.uniforms.op.value = o; m.uniforms.t.value = t } else m.opacity = o * (m.userData.b ?? 1) })
            });
            yw = 0; if (best !== cur) show(best); updRx();
            const q = fmt(Math.pow(10, s)); if (q !== lv) { lv = q; $('rv').textContent = q } const e = s.toFixed(1); if (e !== lr) { lr = e; $('re').innerHTML = '10<sup>' + e + '</sup> metres' + (s < -20 ? ' · ' + (Math.pow(10, s) / 1.616e-35).toPrecision(3) + ' Planck lengths' : '') }
            const p = (s - SMIN) / (SMAX - SMIN) * 100; $('th').style.left = p + '%'; $('fill').style.width = p + '%';
            ren.render(scene, camera);
            LB.forEach(b => { const o = b.st.o; if (o < .25 || !b.st.g.visible) { b.e.style.opacity = 0; return } b.o.getWorldPosition(V); V.project(camera); b.e.style.opacity = V.z < 1 ? Math.min(1, (o - .25) * 2) : 0; b.e.style.transform = 'translate(' + (V.x * .5 + .5) * W + 'px,' + (-V.y * .5 + .5) * Hh + 'px)' })
        }

        /* ---- extra UI: stage list, prev/next, readouts, scale challenge ---- */
        function ft(t) {
            if (t < 1e-9) return 'under a nanosecond';
            const U = [[1e-6, 1e-9, 'nanoseconds'], [1e-3, 1e-6, 'microseconds'], [1, 1e-3, 'milliseconds'], [60, 1, 'seconds'], [3600, 60, 'minutes'], [86400, 3600, 'hours'], [3.156e7, 86400, 'days']];
            for (const [lim, d, u] of U) if (t < lim) { const v = t / d; return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + u }
            const y = t / 3.156e7; return y < 1e3 ? (y < 10 ? y.toFixed(1) : Math.round(y).toLocaleString('en')) + ' years' : y < 1e6 ? Math.round(y / 1e3) + ' thousand years' : y < 1e9 ? (y / 1e6).toFixed(1) + ' million years' : (y / 1e9).toFixed(1) + ' billion years'
        }
        let lx = '';
        function updRx() {
            const m = Math.pow(10, s), r = m / 1.7; let rs;
            if (r >= .01 && r < 1e5) rs = (+r.toPrecision(3)).toLocaleString('en') + '× your height';
            else { const e = Math.floor(Math.log10(r)), mm = r / Math.pow(10, e); rs = mm.toFixed(1) + ' × 10<sup>' + e + '</sup> × your height' }
            const h = rs + ' · light crosses it in ' + ft(m / 299792458); if (h !== lx) { lx = h; $('rx').innerHTML = h }
        }
        function jump(i) { i = clamp(i, 0, S.length - 1); T = S[i].L; stopTour(); $('hint').style.opacity = 0 }
        const grp = L => L < -8 ? 'The quantum world' : L < 3 ? 'Life and machines' : L < 8.6 ? 'Mountains and planets' : L < 15 ? 'Stars and the Solar System' : L < 19 ? 'Star neighbourhoods' : 'Galaxies and beyond';
        const pl = $('plist'), rows = []; let lg = '';
        S.forEach((st, i) => {
            const g0 = grp(st.L); if (g0 !== lg) { lg = g0; const h = document.createElement('div'); h.className = 'gh'; h.textContent = g0; pl.appendChild(h) }
            const b = document.createElement('button'); b.className = 'row'; const a = document.createElement('span'), z = document.createElement('em'); a.textContent = st.n; z.textContent = st.z; b.append(a, z); b.onclick = () => { jump(i); if (innerWidth < 700) $('pnl').classList.remove('open') }; pl.appendChild(b); rows.push(b)
        });
        window.onStage = i => rows.forEach((b, j) => b.classList.toggle('on', j === i));
        rows[cur] && rows[cur].classList.add('on');
        const pnl = $('pnl'); $('lstBtn').onclick = () => pnl.classList.toggle('open'); $('pcl').onclick = () => pnl.classList.remove('open');
        $('prv').onclick = () => jump(cur - 1); $('nxt').onclick = () => jump(cur + 1);
        let ch = null, score = 0;
        function chNew() { let i; do { i = Math.floor(Math.random() * S.length) } while (ch && i === ch.i && S.length > 1); ch = { i, locked: false }; document.body.classList.add('chm'); $('chq').innerHTML = 'How wide is <b>' + S[i].n + '</b>? Travel until the viewing span matches your guess, then lock in. The scene is blurred so you have to rely on what you know.'; $('chA').textContent = 'Lock in' }
        function chOff() { ch = null; document.body.classList.remove('chm'); $('chal').classList.remove('on') }
        $('chBtn').onclick = () => { score = 0; $('chs').textContent = 0; $('chal').classList.add('on'); pnl.classList.remove('open'); chNew() };
        $('chEnd').onclick = chOff;
        $('chA').onclick = () => {
            if (!ch) return;
            if (ch.locked) return chNew();
            const st = S[ch.i], d = Math.abs(s - st.L), pt = Math.max(0, Math.round(10 - d * 2.5)); score += pt; ch.locked = true; document.body.classList.remove('chm'); T = st.L; stopTour();
            $('chs').textContent = score; $('chq').innerHTML = '<b>' + st.n + '</b>: ' + st.z + '. ' + (d < .15 ? 'Spot on!' : 'You were ' + d.toFixed(1) + ' orders of magnitude too ' + (s > st.L ? 'big' : 'small') + '.') + ' +' + pt + ' points.'; $('chA').textContent = 'Next'
        };
        addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'n') jump(cur + 1); else if (k === 'p') jump(cur - 1); else if (k === 'g') pnl.classList.toggle('open'); else if (k === 'escape') { pnl.classList.remove('open'); if (ch) chOff() } });
        requestAnimationFrame(loop);
    </script>
