<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Live Solar System · COSMOSIS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #02040a;
            --p: rgba(10, 15, 28, 0.90);
            --l: rgba(255, 255, 255, 0.10);
            --t: #eef2f8;
            --m: #8d99ad;
            --a: #5cc8ff;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--t);
            font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
            cursor: grab;
        }

        button,
        select,
        input {
            font: inherit;
            color: var(--t);
        }

        .card {
            background: var(--p);
            border: 1px solid var(--l);
            border-radius: 14px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
        }

        #top {
            position: fixed;
            left: 12px;
            right: 12px;
            top: calc(10px + env(safe-area-inset-top, 0px));
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 8px;
            align-items: center;
            padding: 8px 14px;
            z-index: 10;
            scrollbar-width: none;
        }

        #top::-webkit-scrollbar {
            display: none;
        }

        #top h1 {
            font-size: 15px;
            margin: 0 8px 0 0;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        #top a {
            color: var(--a);
            text-decoration: none;
            margin-right: 6px;
            white-space: nowrap;
            font-weight: 500;
        }

        .b {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--l);
            border-radius: 9px;
            padding: 6px 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .b:hover,
        .b.on {
            background: rgba(92, 200, 255, 0.18);
            border-color: var(--a);
            box-shadow: 0 0 12px rgba(92, 200, 255, 0.2);
        }

        input[type=datetime-local],
        select {
            background: #0b1220;
            border: 1px solid var(--l);
            border-radius: 9px;
            padding: 6px 10px;
            color-scheme: dark;
            outline: none;
        }

        input[type=datetime-local]:focus,
        select:focus {
            border-color: var(--a);
        }

        #bar {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            z-index: 10;
            scrollbar-width: thin;
            scrollbar-color: var(--l) transparent;
        }

        #bar::-webkit-scrollbar {
            height: 4px;
        }

        #bar::-webkit-scrollbar-thumb {
            background: var(--l);
            border-radius: 2px;
        }

        #bar .b {
            white-space: nowrap;
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
        }

        #bar i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px currentColor;
        }

        #info {
            position: fixed;
            right: 12px;
            top: calc(68px + env(safe-area-inset-top, 0px));
            bottom: 78px;
            width: 360px;
            max-width: calc(100% - 24px);
            overflow: auto;
            padding: 20px;
            z-index: 9;
            scrollbar-width: thin;
            scrollbar-color: var(--l) transparent;
        }

        #info::-webkit-scrollbar {
            width: 6px;
        }

        #info::-webkit-scrollbar-thumb {
            background: var(--l);
            border-radius: 3px;
        }

        #info h2 {
            margin: 0 0 4px 0;
            font-size: 22px;
            font-weight: 700;
        }

        #info .sub {
            color: var(--m);
            margin-bottom: 14px;
            font-size: 12px;
        }

        #info table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        #info td {
            padding: 6px 0;
            border-bottom: 1px solid var(--l);
            vertical-align: top;
            font-size: 12.5px;
        }

        #info td:first-child {
            color: var(--m);
            width: 44%;
            padding-right: 8px;
        }

        #info h3 {
            font-size: 11.5px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--a);
            margin: 18px 0 6px;
            font-weight: 600;
        }

        #info ul {
            margin: 6px 0;
            padding-left: 18px;
            font-size: 12.5px;
        }

        #info li {
            margin-bottom: 4px;
        }

        #x {
            position: absolute;
            right: 14px;
            top: 14px;
            border: 0;
            background: rgba(255, 255, 255, 0.08);
            color: var(--t);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #x:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .hidden {
            display: none !important;
        }

        #note {
            position: fixed;
            left: 16px;
            bottom: calc(78px + env(safe-area-inset-bottom, 0px));
            font-size: 11px;
            color: var(--m);
            z-index: 8;
            max-width: 55%;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            line-height: 1.4;
        }

        #opt {
            position: fixed;
            left: 12px;
            top: calc(68px + env(safe-area-inset-top, 0px));
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
            z-index: 9;
            width: 220px;
        }

        #opt .b {
            text-align: left;
            width: 100%;
        }

        #opt .b:not(.on) {
            opacity: 0.6;
        }

        #opt .hint {
            font-size: 11px;
            color: var(--m);
            line-height: 1.4;
            margin-top: 6px;
            border-top: 1px solid var(--l);
            padding-top: 6px;
        }

        #info .vlink {
            display: block;
            margin: 12px 0 4px;
            padding: 11px 14px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            color: #02121c;
            background: linear-gradient(135deg, #5cc8ff, #9be7ff);
            border: 1px solid var(--a);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(92, 200, 255, 0.3);
            transition: filter 0.2s, transform 0.2s;
        }

        #info .vlink:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        #info .vhint {
            font-size: 11.5px;
            color: var(--m);
            line-height: 1.45;
            margin: 6px 0 0;
        }

        #info .vjump {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        #info .vjump .b {
            font-size: 11.5px;
            padding: 5px 10px;
        }

        @media(max-width: 768px) {
            #top {
                padding: 6px 10px;
            }

            #info {
                top: auto;
                left: 10px;
                right: 10px;
                width: auto;
                max-width: none;
                bottom: calc(76px + env(safe-area-inset-bottom, 0px));
                max-height: 50vh;
                padding: 16px;
            }

            #opt {
                top: auto;
                left: 10px;
                bottom: calc(76px + env(safe-area-inset-bottom, 0px));
                max-width: 240px;
            }

            #note {
                display: none;
            }
        }
    </style>
    <script src="script2.js"></script>
    <script src="script3.js" defer></script>
    <script src="script7.js" defer></script>
</head>

    <div id="info" class="card hidden"></div>
    <div id="opt" class="card hidden"></div>

    <div id="bar" class="card"></div>
